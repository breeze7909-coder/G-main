name: Halo

on:
  push:
    branches: [main]
    paths: ["halo/**", ".github/workflows/halo.yml"]
  pull_request:
    paths: ["halo/**", ".github/workflows/halo.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: halo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core and build the app
        run: ./gradlew :core:test :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: halo-debug-apk
          path: halo/app/build/outputs/apk/debug/*.apk
