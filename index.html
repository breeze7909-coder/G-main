<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>음성 인식</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #2f6fed;
      --danger: #e5484d;
      --border: #e3e3e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --card: #1c1c1f;
        --text: #ededef;
        --muted: #9a9aa1;
        --accent: #5b8cff;
        --danger: #ff6369;
        --border: #2e2e33;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #toggle { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    #toggle.listening { background: var(--danger); border-color: var(--danger); }
    #status { color: var(--muted); min-height: 1.4em; margin-bottom: 12px; }
    .box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 200px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .interim { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>🎤 음성 인식</h1>
    <p class="sub">버튼을 누르고 말하면 글자로 바뀝니다.</p>

    <div class="controls">
      <button id="toggle">말하기 시작</button>
      <button id="copy">복사</button>
      <button id="clear">지우기</button>
    </div>

    <div id="status"></div>
    <div class="box" id="output"><span id="final"></span><span id="interim" class="interim"></span></div>
  </main>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const toggleBtn = document.getElementById('toggle');
    const copyBtn = document.getElementById('copy');
    const clearBtn = document.getElementById('clear');
    const statusEl = document.getElementById('status');
    const finalEl = document.getElementById('final');
    const interimEl = document.getElementById('interim');

    let finalText = '';
    let listening = false;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    if (!SpeechRecognition) {
      toggleBtn.disabled = true;
      setStatus('이 브라우저는 음성 인식을 지원하지 않아요. 크롬(Chrome)이나 엣지(Edge)로 열어주세요.');
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.continuous = true;      // 말을 멈춰도 계속 듣기
      recognition.interimResults = true;  // 말하는 도중의 결과도 보여주기

      recognition.onstart = () => {
        listening = true;
        toggleBtn.textContent = '멈추기';
        toggleBtn.classList.add('listening');
        setStatus('듣고 있어요… 말해보세요.');
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalText += transcript.trim() + '\n';
          } else {
            interim += transcript;
          }
        }
        finalEl.textContent = finalText;
        interimEl.textContent = interim;
      };

      recognition.onerror = (event) => {
        const messages = {
          'not-allowed': '마이크 권한이 거부됐어요. 브라우저 설정에서 마이크를 허용해주세요.',
          'no-speech': '소리가 들리지 않았어요. 다시 말해보세요.',
          'audio-capture': '마이크를 찾을 수 없어요.',
          'network': '네트워크 오류가 났어요. 인터넷 연결을 확인해주세요.',
        };
        setStatus(messages[event.error] || '오류: ' + event.error);
        if (event.error === 'not-allowed' || event.error === 'audio-capture') {
          listening = false;
        }
      };

      recognition.onend = () => {
        // 일부 브라우저는 잠시 조용하면 자동으로 끝나므로, 멈추기를 누르지 않았다면 다시 시작
        if (listening) {
          try { recognition.start(); return; } catch (e) { /* 이미 시작된 경우 무시 */ }
        }
        toggleBtn.textContent = '말하기 시작';
        toggleBtn.classList.remove('listening');
        interimEl.textContent = '';
        if (!statusEl.textContent.startsWith('오류') && !statusEl.textContent.includes('권한')) {
          setStatus('멈췄어요.');
        }
      };

      toggleBtn.addEventListener('click', () => {
        if (listening) {
          listening = false;
          recognition.stop();
        } else {
          setStatus('');
          recognition.start();
        }
      });
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(finalText.trim());
        setStatus('복사했어요.');
      } catch (e) {
        setStatus('복사에 실패했어요.');
      }
    });

    clearBtn.addEventListener('click', () => {
      finalText = '';
      finalEl.textContent = '';
      interimEl.textContent = '';
      setStatus('지웠어요.');
    });
  </script>
</body>
</html>
